name: Update stat cards

on:
  schedule:
    - cron: "17 18 * * *" # daily, ~01:17 Bangkok
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate_stats.py]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg data/
          if git diff --cached --quiet; then
            echo "Stats unchanged, nothing to commit."
          else
            git commit -m "chore: update stat cards"
            git pull --rebase origin main
            git push
          fi
